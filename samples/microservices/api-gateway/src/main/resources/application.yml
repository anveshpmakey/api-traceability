spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: orders
          uri: lb://order-service
          predicates:
            - Path=/public/api/orders/**
          filters:
            - StripPrefix=1
        - id: inventory
          uri: lb://inventory-service
          predicates:
            - Path=/public/inventory/**
          filters:
            - RewritePath=/public/inventory/(?<segment>.*), /api/inventory/${segment}
